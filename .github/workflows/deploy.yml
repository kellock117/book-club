name: CI & Deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # 1) 검사: PR과 main 모두에서 돈다. 비밀 값은 쓰지 않는다.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          # 빌드만 통과시키는 자리표시 값. 실제 값은 Vercel 프로젝트 환경 변수에 둔다.
          SUPABASE_URL: http://localhost:54321
          SUPABASE_SECRET_KEY: build-placeholder
          SITE_PASSWORD: build-placeholder

  # 2) DB 마이그레이션: main에서만, "production" 환경 승인 규칙을 따른다.
  supabase:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - name: 적용될 마이그레이션 미리보기
        run: supabase db push --dry-run
      - name: 마이그레이션 적용
        run: supabase db push

  # 3) 웹 배포: DB 마이그레이션이 끝난 뒤에 Vercel로 올린다.
  vercel:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: supabase
    runs-on: ubuntu-latest
    environment: production
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm i -g vercel@latest
      - run: vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"
      - run: vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"
      - run: vercel deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}"
